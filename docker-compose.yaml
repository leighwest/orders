version: "3.8"
services:
  database:
    container_name: postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: orders
    ports:
      - 5432:5432
    volumes:
      - data:/var/lib/postgresql/data
# must specify named volumes (not anonymous / bind mounts)
volumes:
  data: