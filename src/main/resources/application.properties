# Database
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:5432/orders
spring.datasource.username=postgres
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.hikari.connection-timeout=30000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Email (AWS SES API)
spring.cloud.aws.ses.region=ap-southeast-2
cupcakes.images.base-url=https://cupcake-orders-images.s3.ap-southeast-4.amazonaws.com

# Web
server.forward-headers-strategy=framework
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.path=/

# AWS
spring.cloud.aws.region.static=ap-southeast-4
sqs.order-created-queue=order-created
sqs.order-dispatched-queue=order-dispatched

# Runtime
spring.threads.virtual.enabled=true

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never